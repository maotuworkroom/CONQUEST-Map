function t(s){
  if(!s) return s;
  const d = I18N[LANG] && I18N[LANG][s];
  if(d !== undefined) return d;
  if(LANG === 'zh-Hans') return toSimplified(s);
  return s;
}
function prefName(id){
  const p = COUNTRIES[id];
  if(!p) return '';
  if(LANG === 'en') return EN_PREF[id] || p.zh;
  if(LANG === 'fr') return FR_PREF[id] || p.zh;
  return t(p.zh);
}
function applyStaticText(){
  const skip = n => n.nodeName === 'SCRIPT' || n.nodeName === 'STYLE' || (n.hasAttribute && n.hasAttribute('data-noi18n'));
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentNode;
      if(!p || skip(p)) return NodeFilter.FILTER_REJECT;
      return n.data.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    if(!n.__orig){ try{ n.__orig = n.data; }catch(e){} }
    if(n.__orig === undefined) return;
    const raw = n.__orig, key = raw.trim ? raw.trim() : raw;
    if(key && key !== raw){
      const hit = I18N[LANG] && I18N[LANG][key];
      if(hit !== undefined){ n.data = hit; return; }
      if(LANG === 'zh-Hans'){ n.data = toSimplified(raw); return; }
    }
    n.data = t(raw);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.getAttribute('data-i18n-title')); });
}
function applyLang(){
  try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
  document.documentElement.lang = LANG;
  document.querySelectorAll('#langSwitch button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  applyStaticText();
  if(curCode && curScore && typeof renderAppBar === 'function') renderAppBar();
  if(curCode && curScore && typeof renderLevelStrip === 'function') renderLevelStrip();
  if(typeof renderLocalMaps === 'function') renderLocalMaps();
  if(selectedId != null && curData) renderPanel(selectedId);
  if(curData){
    if($('dlgWish').open) renderWishDialog();

    if($('dlgAch').open) renderAchDialog();
    if($('dlgSuggest').open) renderSuggestDialog();
    if($('dlgFriends').open) renderFriendsDialog();
  }
}
